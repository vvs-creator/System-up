<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Up</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>

body{
background:#05070d;
color:#00eaff;
font-family:monospace;
margin:0;
text-align:center;
}

.container{
max-width:720px;
margin:auto;
padding:20px;
}

.panel{
background:#0b1220;
border:1px solid #00eaff;
border-radius:12px;
padding:15px;
margin:15px 0;
}

button{
padding:10px;
margin:6px;
background:#08111d;
color:#00eaff;
border:1px solid #00eaff;
border-radius:8px;
cursor:pointer;
}

input,select{
width:100%;
padding:10px;
margin:6px 0;
background:#08111d;
color:#00eaff;
border:1px solid #00eaff;
border-radius:8px;
box-sizing:border-box;
}

.goalBar{
height:12px;
background:#111;
border-radius:10px;
overflow:hidden;
margin-top:8px;
}

.goalFill{
height:100%;
background:#00eaff;
width:0%;
transition:width .2s ease;
}

.driveStatus{
font-size:12px;
color:#7fdbe6;
margin-top:6px;
}

.history-item{
text-align:left;
padding:6px 0;
border-bottom:1px solid #00eaff22;
}

.locked{
opacity:0.35;
}

</style>

</head>

<body>

<div class="container">

<h1>SYSTEM UP</h1>

<button id="googleLogin">☁ Conectar Google Drive</button>
<button id="btnAchievements">🏅 Conquistas</button>
<button id="btnProfile">👤 Perfil</button>
<button id="btnStats">📊 Estatísticas</button>
<button id="btnHistory">📜 Histórico</button>

<div id="achievementsPanel" class="panel" style="display:none">
<h3>Conquistas</h3>
<div id="achievementsList"></div>
</div>

<div id="profilePanel" class="panel" style="display:none">

<h3>Perfil</h3>

<input id="profileName" placeholder="Nome">
<input id="profileAge" placeholder="Idade">
<input id="profileWeight" placeholder="Peso">
<input id="profileHeight" placeholder="Altura">

<button id="saveProfileBtn">Salvar Perfil</button>

</div>

<div id="statsPanel" class="panel" style="display:none">

<h3>Estatísticas</h3>

<p>Total de dias: <span id="statDays">0</span></p>
<p>Melhor streak: <span id="statBestStreak">0</span></p>
<p>Média geral: <span id="statAverage">0</span>%</p>
<p>Dias acima de 65%: <span id="statGoodDays">0</span></p>
<p>Dias perfeitos: <span id="statPerfectDays">0</span></p>

</div>

<div id="historyPanel" class="panel" style="display:none">

<h3>Histórico</h3>
<div id="historyList"></div>

</div>

<div class="panel">

<h2 id="playerName">---</h2>

<p>LEVEL <span id="level">1</span></p>
<p>XP <span id="xp">0</span></p>
<p>STREAK <span id="streak">0</span></p>

<p>STATUS DO DIA <span id="liveScore">0</span>%</p>

<div class="goalBar">
<div id="goalFill" class="goalFill"></div>
</div>

<div id="driveStatus" class="driveStatus">
🔵 Online
</div>

</div>

<div class="panel">

<h3>ÁGUA</h3>

<input id="waterInput" type="number" placeholder="ml">
<button id="addWaterBtn">Adicionar</button>

<p>Total: <span id="waterTotal">0</span> ml</p>

</div>

<div class="panel">

<h3>ATRIBUTOS</h3>

<select id="exercise">
<option value="10">Muito ruim</option>
<option value="25">Ruim</option>
<option value="50" selected>Bom</option>
<option value="75">Muito bom</option>
<option value="100">Excelente</option>
</select>

<select id="meditation">
<option value="10">Muito ruim</option>
<option value="25">Ruim</option>
<option value="50" selected>Bom</option>
<option value="75">Muito bom</option>
<option value="100">Excelente</option>
</select>

<select id="fun">
<option value="10">Muito ruim</option>
<option value="25">Ruim</option>
<option value="50" selected>Bom</option>
<option value="75">Muito bom</option>
<option value="100">Excelente</option>
</select>

<select id="sleep">
<option value="25">Ruim</option>
<option value="50" selected>Normal</option>
<option value="75">Bom</option>
<option value="100">Excelente</option>
</select>

<select id="discipline">
<option value="10">Muito ruim</option>
<option value="25">Ruim</option>
<option value="50" selected>Bom</option>
<option value="75">Muito bom</option>
<option value="100">Excelente</option>
</select>

</div>

<div class="panel">

<h3>ALIMENTAÇÃO</h3>

<button class="foodBtn" data-food="30">Boa +30</button>
<button class="foodBtn" data-food="15">Comum +15</button>
<button class="foodBtn" data-food="-20">Ruim -20</button>

<p>Total alimentação: <span id="foodTotal">0</span>%</p>

</div>

<div class="panel">

<button id="saveBtn">SALVAR</button>

</div>

</div>

<script>

let googleToken=null

function el(id){
return document.getElementById(id)
}

function setDriveStatus(text){
el("driveStatus").innerText=text
}

function updateConnectionStatus(){

if(!navigator.onLine){
setDriveStatus("🟡 Offline (salvando localmente)")
return
}

if(googleToken){
setDriveStatus("🟢 Drive conectado")
}else{
setDriveStatus("🔵 Online (conecte o Drive)")
}

}

window.addEventListener("online",updateConnectionStatus)
window.addEventListener("offline",updateConnectionStatus)

let data={
profile:{name:"",age:"",weight:"",height:""},
xp:0,
level:1,
streak:0,
water:0,
food:0,
history:[]
}

function render(){

el("playerName").innerText=data.profile.name||"---"
el("level").innerText=data.level
el("xp").innerText=data.xp
el("streak").innerText=data.streak
el("waterTotal").innerText=data.water
el("foodTotal").innerText=data.food

}

function addWater(){

const value=parseInt(el("waterInput").value)

if(!value)return

data.water+=value

el("waterInput").value=""

render()

}

function addFood(value){

data.food+=value

if(data.food>100)data.food=100
if(data.food<0)data.food=0

render()

}

document.querySelectorAll(".foodBtn").forEach(btn=>{
btn.onclick=()=>addFood(Number(btn.dataset.food))
})

el("addWaterBtn").onclick=addWater

function loginGoogle(){

google.accounts.oauth2.initTokenClient({

client_id:"27733815895-qf1njapvbrvc7rsfenp1pekbah57fs09.apps.googleusercontent.com",

scope:"https://www.googleapis.com/auth/drive.file",

callback:async(tokenResponse)=>{

googleToken=tokenResponse.access_token

setDriveStatus("🟢 Drive conectado")

}

}).requestAccessToken()

}

el("googleLogin").onclick=loginGoogle

updateConnectionStatus()

render()

</script>

</body>
</html>

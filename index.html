<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Up</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{
background:#05070d;
color:#00eaff;
font-family:monospace;
margin:0;
text-align:center;
}

.container{
max-width:720px;
margin:auto;
padding:20px;
}

.panel{
background:#0b1220;
border:1px solid #00eaff;
border-radius:12px;
padding:15px;
margin:15px 0;
}

button{
padding:10px;
margin:6px;
background:#08111d;
color:#00eaff;
border:1px solid #00eaff;
border-radius:8px;
cursor:pointer;
}

button:disabled{
opacity:0.4;
cursor:not-allowed;
}

input,select{
width:100%;
padding:10px;
margin:6px 0;
background:#08111d;
color:#00eaff;
border:1px solid #00eaff;
border-radius:8px;
box-sizing:border-box;
}

.goalBar{
height:12px;
background:#111;
border-radius:10px;
overflow:hidden;
margin-top:8px;
}

.goalFill{
height:100%;
background:#00eaff;
width:0%;
transition:width .2s ease;
}

.achievement{
padding:8px;
border-bottom:1px solid #00eaff33;
text-align:left;
}

.locked{
opacity:0.35;
}

.history-item{
text-align:left;
padding:6px 0;
border-bottom:1px solid #00eaff22;
}

.driveStatus{
font-size:12px;
color:#7fdbe6;
margin-top:6px;
}
</style>
</head>

<body>

<div class="container">

<h1>SYSTEM UP</h1>

<button id="googleLogin">☁ Conectar Google Drive</button>
<button id="btnAchievements">🏅 CONQUISTAS</button>
<button id="btnProfile">👤 PERFIL</button>
<button id="btnStats">📊 ESTATÍSTICAS</button>
<button id="btnHistory">📜 HISTÓRICO</button>

<div id="achievementsPanel" class="panel" style="display:none;">
<h3>MEDALHAS</h3>
<div id="achievementsList"></div>
</div>

<div id="profilePanel" class="panel" style="display:none;">
<h3>PERFIL</h3>

<input id="profileName" placeholder="Nome">
<input id="profileAge" placeholder="Idade">
<input id="profileWeight" placeholder="Peso">
<input id="profileHeight" placeholder="Altura">

<button id="saveProfileBtn">Salvar Perfil</button>

</div>

<div id="statsPanel" class="panel" style="display:none;">
<h3>ESTATÍSTICAS</h3>

<p>Total de dias: <span id="statDays">0</span></p>
<p>Melhor streak: <span id="statBestStreak">0</span></p>
<p>Média geral: <span id="statAverage">0</span>%</p>
<p>Dias acima de 65%: <span id="statGoodDays">0</span></p>
<p>Dias perfeitos: <span id="statPerfectDays">0</span></p>

</div>

<div id="historyPanel" class="panel" style="display:none;">
<h3>HISTÓRICO</h3>
<div id="historyList"></div>
</div>

<div class="panel">

<h2 id="playerName">---</h2>

<p>LEVEL <span id="level">1</span></p>
<p>XP <span id="xp">0</span></p>
<p>STREAK <span id="streak">0</span></p>

<p>STATUS DO DIA <span id="liveScore">0</span>%</p>

<div class="goalBar">
<div id="goalFill" class="goalFill"></div>
</div>

<div id="driveStatus" class="driveStatus">
Drive desconectado
</div>

</div>

<div class="panel">

<h3>ÁGUA</h3>

<input id="waterInput" type="number" placeholder="ml">
<button id="addWaterBtn">Adicionar</button>

<p>Total: <span id="waterTotal">0</span> ml</p>

</div>

<div class="panel">

<h3>ATRIBUTOS</h3>

<select id="exercise">
<option value="10">Exercício Muito ruim</option>
<option value="25">Exercício Ruim</option>
<option value="50" selected>Exercício Bom</option>
<option value="75">Exercício Muito bom</option>
<option value="100">Exercício Excelente</option>
</select>

<select id="meditation">
<option value="10">Meditação Muito ruim</option>
<option value="25">Meditação Ruim</option>
<option value="50" selected>Meditação Boa</option>
<option value="75">Meditação Muito boa</option>
<option value="100">Meditação Excelente</option>
</select>

<select id="fun">
<option value="10">Lazer Muito ruim</option>
<option value="25">Lazer Ruim</option>
<option value="50" selected>Lazer Bom</option>
<option value="75">Lazer Muito bom</option>
<option value="100">Lazer Excelente</option>
</select>

<select id="sleep">
<option value="25">Sono Ruim</option>
<option value="50" selected>Sono Normal</option>
<option value="75">Sono Bom</option>
<option value="100">Sono Excelente</option>
</select>

<select id="discipline">
<option value="10">Disciplina Muito ruim</option>
<option value="25">Disciplina Ruim</option>
<option value="50" selected>Disciplina Boa</option>
<option value="75">Disciplina Muito boa</option>
<option value="100">Disciplina Excelente</option>
</select>

</div>

<div class="panel">

<h3>ALIMENTAÇÃO</h3>

<button class="foodBtn" data-food="30">Boa +30</button>
<button class="foodBtn" data-food="15">Comum +15</button>
<button class="foodBtn" data-food="-20">Ruim -20</button>

<p>Total alimentação: <span id="foodTotal">0</span>%</p>

</div>

<div class="panel">
<button id="saveBtn">SALVAR</button>
</div>

</div>

<script>

const STORAGE="systemup";
const GOOGLE_CLIENT_ID="27733815895-qf1njapvbrvc7rsfenp1pekbah57fs09.apps.googleusercontent.com";

let googleToken=null;
let currentDriveFileId=null;
let syncTimeout=null;

function el(id){
return document.getElementById(id);
}

function today(){
return new Date().toISOString().slice(0,10);
}

function getTodayFileName(){
return "systemup-" + today() + ".json";
}

const defaultData={
profile:{name:"",age:"",weight:"",height:""},
xp:0,
level:1,
streak:0,
bestStreak:0,
water:0,
food:0,
lastDate:"",
history:[],
daily:{
exercise:"50",
meditation:"50",
fun:"50",
sleep:"50",
discipline:"50"
},
achievements:{
firstWin:false,
streak3:false,
streak7:false,
streak30:false,
waterMaster:false,
level2:false
}
};

let data=cloneDefaultData();

function cloneDefaultData(){
return JSON.parse(JSON.stringify(defaultData));
}

function saveLocal(){
localStorage.setItem(STORAGE,JSON.stringify(data));
}

function setDriveStatus(text){
el("driveStatus").innerText=text;
}

function updateLevel(){
data.level=Math.floor(data.xp/50)+1;
}

function currentScore(){
const waterPercent=Math.min((data.water/3000)*100,100);

const total=(
waterPercent+
Number(data.daily.exercise)+
Number(data.daily.meditation)+
data.food+
Number(data.daily.fun)+
Number(data.daily.sleep)+
Number(data.daily.discipline)
)/7;

return Math.round(total);
}

function checkAchievements(score){
if(!data.achievements.firstWin && score>=65){
data.achievements.firstWin=true;
}
if(!data.achievements.streak3 && data.streak>=3){
data.achievements.streak3=true;
}
if(!data.achievements.streak7 && data.streak>=7){
data.achievements.streak7=true;
}
if(!data.achievements.streak30 && data.streak>=30){
data.achievements.streak30=true;
}
if(!data.achievements.waterMaster && data.water>=3000){
data.achievements.waterMaster=true;
}
if(!data.achievements.level2 && data.level>=2){
data.achievements.level2=true;
}
}

function closePreviousDayAndStartToday(){
if(!data.lastDate){
data.lastDate=today();
return false;
}

if(data.lastDate===today()){
return false;
}

const previousDayScore=currentScore();
let xpGain=0;

if(previousDayScore>=65){
xpGain=10;
data.streak++;
data.xp+=xpGain;

if(data.streak>data.bestStreak){
data.bestStreak=data.streak;
}
}else{
data.streak=0;
}

updateLevel();
checkAchievements(previousDayScore);

data.history.unshift({
date:data.lastDate,
score:previousDayScore,
xp:xpGain
});

if(data.history.length>60){
data.history=data.history.slice(0,60);
}

data.lastDate=today();
data.water=0;
data.food=0;
data.daily.exercise="50";
data.daily.meditation="50";
data.daily.fun="50";
data.daily.sleep="50";
data.daily.discipline="50";

return true;
}

function ensureCurrentDayState(){
const rolled=closePreviousDayAndStartToday();
if(rolled){
saveLocal();
render();
}
return rolled;
}

function render(){
el("playerName").innerText=data.profile.name||"---";

el("profileName").value=data.profile.name||"";
el("profileAge").value=data.profile.age||"";
el("profileWeight").value=data.profile.weight||"";
el("profileHeight").value=data.profile.height||"";

el("exercise").value=data.daily.exercise;
el("meditation").value=data.daily.meditation;
el("fun").value=data.daily.fun;
el("sleep").value=data.daily.sleep;
el("discipline").value=data.daily.discipline;

el("level").innerText=data.level;
el("xp").innerText=data.xp;
el("streak").innerText=data.streak;
el("waterTotal").innerText=data.water;
el("foodTotal").innerText=data.food;

const score=currentScore();
el("liveScore").innerText=score;
el("goalFill").style.width=Math.min((score/65)*100,100)+"%";

renderHistory();
renderStats();
renderAchievements();
}

function renderHistory(){
el("historyList").innerHTML=data.history.map(item=>`
<div class="history-item">${item.date} — ${item.score}% — +${item.xp}XP</div>
`).join("");
}

function renderAchievements(){
const a=data.achievements;

el("achievementsList").innerHTML=`
<div class="achievement ${a.firstWin?"":"locked"}">Primeira Vitória</div>
<div class="achievement ${a.streak3?"":"locked"}">Disciplina Inicial</div>
<div class="achievement ${a.streak7?"":"locked"}">Foco Inabalável</div>
<div class="achievement ${a.streak30?"":"locked"}">Lenda da Disciplina</div>
<div class="achievement ${a.waterMaster?"":"locked"}">Hidratado</div>
<div class="achievement ${a.level2?"":"locked"}">Primeiro Level Up</div>
`;
}

function renderStats(){
const days=data.history.length;
let avg=0;
let good=0;
let perfect=0;

data.history.forEach(item=>{
avg+=item.score;
if(item.score>=65)good++;
if(item.score===100)perfect++;
});

if(days>0)avg=Math.round(avg/days);

el("statDays").innerText=days;
el("statBestStreak").innerText=data.bestStreak;
el("statAverage").innerText=avg;
el("statGoodDays").innerText=good;
el("statPerfectDays").innerText=perfect;
}

function togglePanel(id){
const panel=el(id);
panel.style.display=panel.style.display==="none"?"block":"none";
}

function scheduleDriveSync(delay=1200){
if(!googleToken)return;

if(syncTimeout){
clearTimeout(syncTimeout);
}

setDriveStatus("Alterações pendentes para sincronizar");

syncTimeout=setTimeout(async()=>{
await saveCurrentDayToDrive(false);
},delay);
}

function persistAndAutosave(){
saveLocal();
render();
scheduleDriveSync();
}

function saveProfile(){
ensureCurrentDayState();

data.profile.name=el("profileName").value;
data.profile.age=el("profileAge").value;
data.profile.weight=el("profileWeight").value;
data.profile.height=el("profileHeight").value;

persistAndAutosave();
}

function addWater(){
ensureCurrentDayState();

const value=parseInt(el("waterInput").value,10);
if(!value)return;

data.water+=value;
el("waterInput").value="";

persistAndAutosave();
}

function addFood(value){
ensureCurrentDayState();

data.food+=value;

if(data.food>100)data.food=100;
if(data.food<0)data.food=0;

persistAndAutosave();
}

function updateDailyField(field,value){
ensureCurrentDayState();
data.daily[field]=value;
persistAndAutosave();
}

async function saveButtonAction(){
ensureCurrentDayState();
saveLocal();
render();

if(googleToken){
setDriveStatus("Salvando no Drive...");
await saveCurrentDayToDrive(false);
}else{
setDriveStatus("Salvo localmente. Conecte o Drive para sincronizar.");
}
}

function findTodayLocalSnapshot(){
return {
...cloneDefaultData(),
...data,
profile:{...cloneDefaultData().profile,...data.profile},
daily:{...cloneDefaultData().daily,...data.daily},
achievements:{...cloneDefaultData().achievements,...data.achievements},
lastDate:today()
};
}

async function findDriveFileByName(fileName){
const response=await fetch(
"https://www.googleapis.com/drive/v3/files?q=name='"+encodeURIComponent(fileName).replace(/%20/g," ")+"' and trashed=false&fields=files(id,name)",
{
headers:{Authorization:"Bearer "+googleToken}
}
);

const result=await response.json();

if(result.files && result.files.length>0){
return result.files[0];
}

return null;
}

async function findLatestDriveFile(){
const response=await fetch(
"https://www.googleapis.com/drive/v3/files?q=name contains 'systemup-' and trashed=false&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc&pageSize=1",
{
headers:{Authorization:"Bearer "+googleToken}
}
);

const result=await response.json();

if(result.files && result.files.length>0){
return result.files[0];
}

return null;
}

async function saveCurrentDayToDrive(useKeepalive){
if(!googleToken)return;

if(syncTimeout){
clearTimeout(syncTimeout);
syncTimeout=null;
}

const snapshot=findTodayLocalSnapshot();
const fileName=getTodayFileName();
const json=JSON.stringify(snapshot);
const file=new Blob([json],{type:"application/json"});

const existing=await findDriveFileByName(fileName);

if(existing){
currentDriveFileId=existing.id;

await fetch(
"https://www.googleapis.com/upload/drive/v3/files/"+currentDriveFileId+"?uploadType=media",
{
method:"PATCH",
headers:{
Authorization:"Bearer "+googleToken,
"Content-Type":"application/json"
},
body:file,
keepalive:useKeepalive
}
);
}else{
const metadata={
name:fileName,
mimeType:"application/json"
};

const form=new FormData();
form.append("metadata",new Blob([JSON.stringify(metadata)],{type:"application/json"}));
form.append("file",file);

await fetch(
"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
{
method:"POST",
headers:{Authorization:"Bearer "+googleToken},
body:form,
keepalive:useKeepalive
}
);

const created=await findDriveFileByName(fileName);
currentDriveFileId=created?created.id:null;
}

setDriveStatus("Backup atualizado no Drive");
}

async function loadSaveFromDrive(){
const latest=await findLatestDriveFile();

if(!latest){
data=cloneDefaultData();
data.lastDate=today();
saveLocal();
render();
setDriveStatus("Drive conectado");
return;
}

const file=await fetch(
"https://www.googleapis.com/drive/v3/files/"+latest.id+"?alt=media",
{
headers:{Authorization:"Bearer "+googleToken}
}
);

const text=await file.text();
if(!text){
setDriveStatus("Erro ao carregar save do Drive");
return;
}

try{
const loaded=JSON.parse(text);

data={
...cloneDefaultData(),
...loaded,
profile:{...cloneDefaultData().profile,...(loaded.profile||{})},
daily:{...cloneDefaultData().daily,...(loaded.daily||{})},
achievements:{...cloneDefaultData().achievements,...(loaded.achievements||{})}
};

const rolled=closePreviousDayAndStartToday();

saveLocal();
updateLevel();
render();

if(rolled){
setDriveStatus("Novo dia iniciado");
await saveCurrentDayToDrive(false);
}else{
setDriveStatus("Save carregado do Drive");
currentDriveFileId=latest.id;
}
}catch{
setDriveStatus("Erro ao carregar save do Drive");
}
}

function loginGoogle(){
google.accounts.oauth2.initTokenClient({
client_id:GOOGLE_CLIENT_ID,
scope:"https://www.googleapis.com/auth/drive.file",
callback:async(tokenResponse)=>{
googleToken=tokenResponse.access_token;
setDriveStatus("Drive conectado");
await loadSaveFromDrive();
}
}).requestAccessToken();
}

function attachEvents(){
el("googleLogin").onclick=loginGoogle;

el("btnAchievements").onclick=()=>togglePanel("achievementsPanel");
el("btnProfile").onclick=()=>togglePanel("profilePanel");
el("btnStats").onclick=()=>togglePanel("statsPanel");
el("btnHistory").onclick=()=>togglePanel("historyPanel");

el("saveProfileBtn").onclick=saveProfile;
el("addWaterBtn").onclick=addWater;
el("saveBtn").onclick=saveButtonAction;

document.querySelectorAll(".foodBtn").forEach(btn=>{
btn.onclick=()=>addFood(Number(btn.dataset.food));
});

el("exercise").addEventListener("change",e=>updateDailyField("exercise",e.target.value));
el("meditation").addEventListener("change",e=>updateDailyField("meditation",e.target.value));
el("fun").addEventListener("change",e=>updateDailyField("fun",e.target.value));
el("sleep").addEventListener("change",e=>updateDailyField("sleep",e.target.value));
el("discipline").addEventListener("change",e=>updateDailyField("discipline",e.target.value));

window.addEventListener("pagehide",()=>{
if(googleToken){
saveLocal();
saveCurrentDayToDrive(true);
}
});

document.addEventListener("visibilitychange",()=>{
if(document.visibilityState==="hidden" && googleToken){
saveLocal();
saveCurrentDayToDrive(true);
}
});
}

attachEvents();
render();

</script>

</body>
</html>

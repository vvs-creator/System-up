<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Up</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>

body{
background:#05070d;
color:#00eaff;
font-family:monospace;
margin:0;
text-align:center;
}

.container{
max-width:720px;
margin:auto;
padding:20px;
}

.panel{
background:#0b1220;
border:1px solid #00eaff;
border-radius:12px;
padding:15px;
margin:15px 0;
}

button{
padding:10px;
margin:6px;
background:#08111d;
color:#00eaff;
border:1px solid #00eaff;
border-radius:8px;
cursor:pointer;
}

input,select{
width:100%;
padding:10px;
margin:6px 0;
background:#08111d;
color:#00eaff;
border:1px solid #00eaff;
border-radius:8px;
box-sizing:border-box;
}

.goalBar{
height:12px;
background:#111;
border-radius:10px;
overflow:hidden;
margin-top:8px;
}

.goalFill{
height:100%;
background:#00eaff;
width:0%;
transition:width .2s ease;
}

.achievement{
padding:8px;
border-bottom:1px solid #00eaff33;
text-align:left;
}

.locked{
opacity:0.35;
}

.history-item{
text-align:left;
padding:6px 0;
border-bottom:1px solid #00eaff22;
}

</style>
</head>

<body>

<div class="container">

<h1>SYSTEM UP</h1>

<button id="googleLogin">☁ Conectar Google Drive</button>
<button id="btnAchievements">🏅 CONQUISTAS</button>
<button id="btnProfile">👤 PERFIL</button>
<button id="btnStats">📊 ESTATÍSTICAS</button>

<div id="achievementsPanel" class="panel" style="display:none;">
<h3>MEDALHAS</h3>
<div id="achievementsList"></div>
</div>

<div id="profilePanel" class="panel" style="display:none;">
<h3>PERFIL</h3>

<input id="profileName" placeholder="Nome">
<input id="profileAge" placeholder="Idade">
<input id="profileWeight" placeholder="Peso">
<input id="profileHeight" placeholder="Altura">

<button id="saveProfileBtn">Salvar Perfil</button>

</div>

<div id="statsPanel" class="panel" style="display:none;">

<h3>ESTATÍSTICAS</h3>

<p>Total de dias: <span id="statDays">0</span></p>
<p>Melhor streak: <span id="statBestStreak">0</span></p>
<p>Média geral: <span id="statAverage">0</span>%</p>

</div>

<div class="panel">

<h2 id="playerName">---</h2>

<p>LEVEL <span id="level">1</span></p>
<p>XP <span id="xp">0</span></p>
<p>STREAK <span id="streak">0</span></p>

<p>STATUS DO DIA <span id="liveScore">0</span>%</p>

<div class="goalBar">
<div id="goalFill" class="goalFill"></div>
</div>

</div>

<div class="panel">

<h3>ÁGUA</h3>

<input id="waterInput" type="number" placeholder="ml">

<button id="addWaterBtn">Adicionar</button>

<p>Total: <span id="waterTotal">0</span> ml</p>

</div>

<div class="panel">

<h3>ALIMENTAÇÃO</h3>

<button class="foodBtn" data-food="30">Boa +30</button>
<button class="foodBtn" data-food="15">Comum +15</button>
<button class="foodBtn" data-food="-20">Ruim -20</button>

<p>Total alimentação: <span id="foodTotal">0</span>%</p>

</div>

<div class="panel">

<button id="finalizeBtn">FINALIZAR DIA</button>

</div>

<div class="panel">

<h3>HISTÓRICO</h3>

<div id="historyList"></div>

</div>

</div>

<script>

const STORAGE="systemup"

const GOOGLE_CLIENT_ID="27733815895-qf1njapvbrvc7rsfenp1pekbah57fs09.apps.googleusercontent.com"

let googleToken=null

let data={
profile:{name:"",age:"",weight:"",height:""},
xp:0,
level:1,
streak:0,
water:0,
food:0,
history:[]
}

function el(id){
return document.getElementById(id)
}

function save(){
localStorage.setItem(STORAGE,JSON.stringify(data))
}

function today(){
return new Date().toISOString().slice(0,10)
}

function addWater(){

const value=parseInt(el("waterInput").value)

if(!value)return

data.water+=value

el("waterInput").value=""

save()

render()

}

function addFood(value){

data.food+=value

if(data.food>100)data.food=100
if(data.food<0)data.food=0

save()

render()

}

function liveScore(){

const waterPercent=Math.min((data.water/3000)*100,100)

const total=(

waterPercent+
data.food+
50+50+50+50

)/6

return Math.round(total)

}

function updateScore(){

const score=liveScore()

el("liveScore").innerText=score

el("goalFill").style.width=Math.min((score/65)*100,100)+"%"

}

function finalizeDay(){

const score=liveScore()

let xpGain=0

if(score>=65){

xpGain=10

data.streak++

data.xp+=xpGain

}else{

data.streak=0

}

data.level=Math.floor(data.xp/50)+1

data.history.unshift({
date:today(),
score,
xp:xpGain
})

if(data.history.length>60)data.history=data.history.slice(0,60)

save()

render()

uploadSaveToDrive()

}

function render(){

el("playerName").innerText=data.profile.name||"---"

el("profileName").value=data.profile.name||""
el("profileAge").value=data.profile.age||""
el("profileWeight").value=data.profile.weight||""
el("profileHeight").value=data.profile.height||""

el("level").innerText=data.level
el("xp").innerText=data.xp
el("streak").innerText=data.streak

el("waterTotal").innerText=data.water
el("foodTotal").innerText=data.food

updateScore()

renderHistory()

}

function renderHistory(){

el("historyList").innerHTML=data.history.map(item=>`
<div class="history-item">${item.date} — ${item.score}% — +${item.xp}XP</div>
`).join("")

}

function togglePanel(id){

const panel=el(id)

panel.style.display=panel.style.display==="none"?"block":"none"

}

function saveProfile(){

data.profile.name=el("profileName").value
data.profile.age=el("profileAge").value
data.profile.weight=el("profileWeight").value
data.profile.height=el("profileHeight").value

save()

render()

}

document.querySelectorAll(".foodBtn").forEach(btn=>{
btn.onclick=()=>addFood(Number(btn.dataset.food))
})

el("addWaterBtn").onclick=addWater
el("finalizeBtn").onclick=finalizeDay
el("saveProfileBtn").onclick=saveProfile

el("btnAchievements").onclick=()=>togglePanel("achievementsPanel")
el("btnProfile").onclick=()=>togglePanel("profilePanel")
el("btnStats").onclick=()=>togglePanel("statsPanel")

function loginGoogle(){

google.accounts.oauth2.initTokenClient({

client_id:GOOGLE_CLIENT_ID,

scope:"https://www.googleapis.com/auth/drive.file",

callback:async(tokenResponse)=>{

googleToken=tokenResponse.access_token

await loadSaveFromDrive()

}

}).requestAccessToken()

}

el("googleLogin").onclick=loginGoogle

async function uploadSaveToDrive(){

if(!googleToken)return

const saveData=localStorage.getItem(STORAGE)

const file=new Blob([saveData],{type:"application/json"})

await fetch(
"https://www.googleapis.com/upload/drive/v3/files?uploadType=media",
{
method:"POST",
headers:{
Authorization:"Bearer "+googleToken
},
body:file
}
)

}

async function loadSaveFromDrive(){

const search=await fetch(
"https://www.googleapis.com/drive/v3/files?q=name='systemup-save.json' and trashed=false&fields=files(id,name)",
{
headers:{Authorization:"Bearer "+googleToken}
}
)

const result=await search.json()

if(!result.files.length)return

const fileId=result.files[0].id

const file=await fetch(
"https://www.googleapis.com/drive/v3/files/"+fileId+"?alt=media",
{
headers:{Authorization:"Bearer "+googleToken}
}
)

data=JSON.parse(await file.text())

render()

}

render()

</script>

</body>
</html>

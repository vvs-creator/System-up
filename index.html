<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Up</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{
background:#05070d;
color:#00eaff;
font-family:monospace;
margin:0;
text-align:center;
}

.container{
max-width:720px;
margin:auto;
padding:20px;
}

.panel{
background:#0b1220;
border:1px solid #00eaff;
border-radius:12px;
padding:15px;
margin:15px 0;
}

button{
padding:10px;
margin:6px;
background:#08111d;
color:#00eaff;
border:1px solid #00eaff;
border-radius:8px;
cursor:pointer;
}

button:disabled{
opacity:0.4;
cursor:not-allowed;
}

input,select{
width:100%;
padding:10px;
margin:6px 0;
background:#08111d;
color:#00eaff;
border:1px solid #00eaff;
border-radius:8px;
box-sizing:border-box;
}

.goalBar{
height:12px;
background:#111;
border-radius:10px;
overflow:hidden;
margin-top:8px;
}

.goalFill{
height:100%;
background:#00eaff;
width:0%;
transition:width .2s ease;
}

.avatar{
width:140px;
height:140px;
margin:10px auto;
border-radius:10px;
object-fit:cover;
image-rendering:pixelated;
display:block;
background:#08111d;
border:4px solid #00eaff;
}

.achievement{
padding:8px;
border-bottom:1px solid #00eaff33;
text-align:left;
}

.locked{
opacity:0.35;
}

.history-item{
text-align:left;
padding:6px 0;
border-bottom:1px solid #00eaff22;
}

.status-note{
font-size:12px;
color:#7fdbe6;
margin-top:6px;
}
</style>
</head>

<body>

<div class="container">

<h1>SYSTEM UP</h1>

<button id="googleLogin">☁ Conectar Google Drive</button>

<div class="panel">

<h2 id="playerName">Victor</h2>

<p>LEVEL <span id="level">1</span></p>
<p>XP <span id="xp">0</span></p>
<p>STREAK <span id="streak">0</span></p>

<p>STATUS DO DIA <span id="liveScore">0</span>%</p>

<div class="goalBar">
<div id="goalFill" class="goalFill"></div>
</div>

<div class="status-note" id="driveStatus">Drive não conectado</div>

</div>

<div class="panel">

<h3>ÁGUA</h3>

<input id="waterInput" type="number" placeholder="ml">
<button id="addWaterBtn">Adicionar</button>

<p>Total: <span id="waterTotal">0</span> ml</p>

</div>

<div class="panel">

<h3>ALIMENTAÇÃO</h3>

<button class="foodBtn" data-food="30">Boa +30</button>
<button class="foodBtn" data-food="15">Comum +15</button>
<button class="foodBtn" data-food="-20">Ruim -20</button>

<p>Total alimentação: <span id="foodTotal">0</span>%</p>

</div>

<div class="panel">
<button id="finalizeBtn">FINALIZAR DIA</button>
</div>

<div class="panel">
<h3>HISTÓRICO</h3>
<div id="historyList"></div>
</div>

</div>

<script>

const STORAGE="systemup"

const GOOGLE_CLIENT_ID="27733815895-qf1njapvbrvc7rsfenp1pekbah57fs09.apps.googleusercontent.com"

let googleToken=null

function el(id){return document.getElementById(id)}

const defaultData={
xp:0,
level:1,
streak:0,
water:0,
food:0,
lastDate:"",
dayFinalized:false,
history:[]
}

let data=loadData()

function loadData(){

try{

const saved=JSON.parse(localStorage.getItem(STORAGE))

if(!saved)return {...defaultData}

return {...defaultData,...saved}

}catch{

return {...defaultData}

}

}

function save(){

localStorage.setItem(STORAGE,JSON.stringify(data))

}

function today(){

return new Date().toISOString().slice(0,10)

}

function updateLevel(){

data.level=Math.floor(data.xp/50)+1

}

function addWater(){

if(data.dayFinalized)return

const value=parseInt(el("waterInput").value)

if(!value)return

data.water+=value

el("waterInput").value=""

save()

render()

}

function addFood(value){

if(data.dayFinalized)return

data.food+=value

if(data.food>100)data.food=100
if(data.food<0)data.food=0

save()

render()

}

function liveScoreValue(){

const waterPercent=Math.min((data.water/3000)*100,100)

const total=(

waterPercent+
data.food+
50+50+50+50

)/6

return Math.round(total)

}

function updateLiveScore(){

const score=liveScoreValue()

el("liveScore").innerText=score

el("goalFill").style.width=Math.min((score/65)*100,100)+"%"

}

function render(){

el("xp").innerText=data.xp
el("level").innerText=data.level
el("streak").innerText=data.streak
el("waterTotal").innerText=data.water
el("foodTotal").innerText=data.food

renderHistory()

updateLiveScore()

}

function renderHistory(){

el("historyList").innerHTML=data.history.map(item=>`
<div class="history-item">${item.date} — ${item.score}% — +${item.xp}XP</div>
`).join("")

}

async function finalizeDay(){

if(data.dayFinalized)return

const score=liveScoreValue()

let xpGain=0

if(score>=65){

xpGain=10

data.streak+=1

data.xp+=xpGain

}else{

data.streak=0

}

updateLevel()

data.dayFinalized=true

data.history.unshift({

date:today(),
score,
xp:xpGain

})

if(data.history.length>60)data.history=data.history.slice(0,60)

save()

render()

await uploadSaveToDrive()

}

function loginGoogle(){

google.accounts.oauth2.initTokenClient({

client_id:GOOGLE_CLIENT_ID,

scope:"https://www.googleapis.com/auth/drive.file",

callback:async(tokenResponse)=>{

googleToken=tokenResponse.access_token

el("driveStatus").innerText="Drive conectado"

await loadSaveFromDrive()

}

}).requestAccessToken()

}

async function uploadSaveToDrive(){

if(!googleToken)return

const saveData=localStorage.getItem(STORAGE)

const file=new Blob([saveData],{type:"application/json"})

const search=await fetch(

"https://www.googleapis.com/drive/v3/files?q=name='systemup-save.json' and trashed=false&fields=files(id,name)",

{

headers:{Authorization:"Bearer "+googleToken}

}

)

const result=await search.json()

let fileId=null

if(result.files && result.files.length>0){

fileId=result.files[0].id

}

if(fileId){

await fetch(

"https://www.googleapis.com/upload/drive/v3/files/"+fileId+"?uploadType=media",

{

method:"PATCH",

headers:{
Authorization:"Bearer "+googleToken,
"Content-Type":"application/json"
},

body:file

}

)

}else{

const metadata={

name:"systemup-save.json",
mimeType:"application/json"

}

const form=new FormData()

form.append("metadata",new Blob([JSON.stringify(metadata)],{type:"application/json"}))
form.append("file",file)

await fetch(

"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",

{

method:"POST",
headers:{Authorization:"Bearer "+googleToken},
body:form

}

)

}

el("driveStatus").innerText="Backup atualizado no Drive"

}

async function loadSaveFromDrive(){

if(!googleToken)return

const search=await fetch(

"https://www.googleapis.com/drive/v3/files?q=name='systemup-save.json' and trashed=false&fields=files(id,name)",

{

headers:{Authorization:"Bearer "+googleToken}

}

)

const result=await search.json()

if(!result.files || result.files.length===0)return

const fileId=result.files[0].id

const file=await fetch(

"https://www.googleapis.com/drive/v3/files/"+fileId+"?alt=media",

{

headers:{Authorization:"Bearer "+googleToken}

}

)

const text=await file.text()

const loaded=JSON.parse(text)

data={...defaultData,...loaded}

if(data.lastDate!==today()){

data.lastDate=today()
data.water=0
data.food=0
data.dayFinalized=false

}

save()

updateLevel()

render()

el("driveStatus").innerText="Save carregado do Drive"

}

document.getElementById("googleLogin").onclick=loginGoogle

document.getElementById("addWaterBtn").onclick=addWater

document.getElementById("finalizeBtn").onclick=finalizeDay

document.querySelectorAll(".foodBtn").forEach(btn=>{

btn.addEventListener("click",()=>addFood(Number(btn.dataset.food)))

})

if(data.lastDate!==today()){

data.lastDate=today()
data.water=0
data.food=0
data.dayFinalized=false
save()

}

updateLevel()

render()

</script>

</body>
</html>
